name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run that is still going.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formatting, linters, tests, names and package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned to the commits that the `v7` tags pointed at on 2026-10-07: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned to the commit that the `v6.1.0` tag pointed at on 2026-10-11, like the actions above it. It reads the pnpm version from
      # `packageManager` in package.json, and goes before `setup-node` so that `cache: pnpm` finds it.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The official `numbat` program, at the version and checksum in `numbat-version.json`.
      - run: node tools/install-numbat.mjs

      # Prettier, ESLint, markdownlint, the tests, the documents check, the names and values checks, and the package contents.
      - run: pnpm run check
        env:
          REQUIRE_NUMBAT: '1'
