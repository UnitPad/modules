name: Maintenance

# Two lists that a pull request never runs: the modules that are due a check, and the sources that no longer answer.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: Modules due a check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # The list is a to-do, not a failure: it is written to the summary of the run.
      - run: |
          {
            echo '## Modules due a check'
            echo
            node tools/stale.mjs | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  links:
    name: Sources that no longer answer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      # A source that does not answer fails the run, so the maintainers are told.
      - run: node tools/links.mjs
