name: Release

# A tag `vX.Y.Z` publishes that version to npm. Nobody publishes from a laptop: the package then names the commit it was built from.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Pinned to the commit that the `v6.1.0` tag pointed at on 2026-10-11, like the actions above it. It reads the pnpm version from
      # `packageManager` in package.json, and goes before `setup-node` so that `cache: pnpm` finds it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: node tools/install-numbat.mjs
      - run: pnpm run check
        env:
          REQUIRE_NUMBAT: '1'

      - name: The tag is the version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      # `api.json` must be the names of exactly this release (`node tools/api.mjs --update` before the tag).
      - run: node tools/api.mjs --release

      # The same for the values: `values.json` is exactly this release (`node tools/values.mjs --update`).
      - run: node tools/values.mjs --release
        env:
          REQUIRE_NUMBAT: '1'

      # Trusted publishing needs npm 11.5.1 or newer, and Node 22 ships npm 10. The version is pinned, as the actions are.
      - run: npm install -g npm@11.21.0

      # No token: npm trusts this workflow of this repository (the package's settings on npmjs.com), through `id-token: write`.
      # The packages are installed and checked with pnpm, and published with npm on purpose: the trust and the provenance are npm's.
      - run: npm publish --provenance --access public
